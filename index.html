<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <!-- Standard viewport tag -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  
  <title>YT Apps Hub</title>
  <link rel="icon" href="https://lh3.googleusercontent.com/d/1IUz-NOgOY88Uxvj8Mh5ZflCQC8kIrubz">

  <!-- Premium Google Fonts: Outfit (Headings) & Inter (UI/Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Outfit:wght@500;600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Tailwind Configuration -->
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
          },
          screens: {
            'xs': '380px',
          },
          colors: {
            neutral: {
              850: '#1f1f1f',
            }
          }
        }
      }
    }
  </script>

  <style type="text/tailwindcss">
    @layer utilities {
      .p-safe {
        padding-top: max(2rem, env(safe-area-inset-top));
        padding-right: max(1.25rem, env(safe-area-inset-right));
        padding-bottom: max(2rem, env(safe-area-inset-bottom));
        padding-left: max(1.25rem, env(safe-area-inset-left));
      }
    }
    * {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>

<body class="bg-[#F8F9FA] dark:bg-[#0A0A0A] text-neutral-900 dark:text-neutral-100 min-h-screen selection:bg-neutral-200 dark:selection:bg-neutral-800">

  <main class="max-w-[520px] mx-auto w-full p-safe">

    <!-- Header Section -->
    <header class="mb-8 pl-1">
      <h1 class="font-display text-2xl xs:text-[26px] font-semibold tracking-tight text-neutral-950 dark:text-white mb-1.5">
        YT Apps Hub
      </h1>
      <p class="text-[14px] text-neutral-500 dark:text-neutral-400 font-normal">
        Latest verified APK distributions
      </p>
    </header>

    <!-- MicroG Services App Card -->
<article class="bg-white dark:bg-[#141414] rounded-2xl p-4 mb-3.5 border border-neutral-200/80 dark:border-neutral-800/80 shadow-sm flex items-center gap-4 transition-all duration-300 hover:border-neutral-300 dark:hover:border-neutral-700 hover:shadow-md">
  
  <img src="https://lh3.googleusercontent.com/d/1IUz-NOgOY88Uxvj8Mh5ZflCQC8kIrubz" alt="MicroG Icon" 
       class="w-[46px] h-[46px] rounded-[12px] object-cover border border-black/5 dark:border-white/10 shrink-0">
  
  <div class="flex-1 min-w-0 flex flex-col justify-center">
    <h2 class="font-display text-[16px] font-medium tracking-tight text-neutral-950 dark:text-white mb-0.5 truncate">
      MicroG Services
    </h2>
    <div class="flex items-center gap-1.5">
      <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full shrink-0"></span>
      <span id="microgDate" class="text-[13px] text-neutral-500 dark:text-neutral-400 truncate">
        Checking for updates...
      </span>
    </div>
  </div>

  <a id="microgBtn" target="_blank" download
     class="inline-flex items-center justify-center gap-1.5 h-10 px-4 xs:px-5 bg-neutral-950 hover:bg-neutral-800 dark:bg-white dark:hover:bg-neutral-200 text-white dark:text-neutral-950 rounded-full font-medium text-[13px] transition-all duration-200 active:scale-95 shrink-0 select-none outline-none focus-visible:ring-2 focus-visible:ring-neutral-400 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-[#141414] cursor-pointer">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
      <polyline points="7 10 12 15 17 10"></polyline>
      <line x1="12" y1="15" x2="12" y2="3"></line>
    </svg>
    <span class="hidden xs:block">Download</span>
  </a>
</article>

    <!-- YouTube App Card -->
    <article class="bg-white dark:bg-[#141414] rounded-2xl p-4 mb-3.5 border border-neutral-200/80 dark:border-neutral-800/80 shadow-sm flex items-center gap-4 transition-all duration-300 hover:border-neutral-300 dark:hover:border-neutral-700 hover:shadow-md">
      
      <img src="https://lh3.googleusercontent.com/d/1IUz-NOgOY88Uxvj8Mh5ZflCQC8kIrubz" alt="YouTube Icon" 
           class="w-[46px] h-[46px] rounded-[12px] object-cover border border-black/5 dark:border-white/10 shrink-0">
      
      <div class="flex-1 min-w-0 flex flex-col justify-center">
        <h2 class="font-display text-[16px] font-medium tracking-tight text-neutral-950 dark:text-white mb-0.5 truncate">
          YouTube
        </h2>
        <div class="flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full shrink-0"></span>
          <span id="ytDate" class="text-[13px] text-neutral-500 dark:text-neutral-400 truncate">
            Checking for updates...
          </span>
        </div>
      </div>

      <!-- Note the added 'download' attribute -->
      <a id="ytBtn" target="_blank" download
         class="inline-flex items-center justify-center gap-1.5 h-10 px-4 xs:px-5 bg-neutral-950 hover:bg-neutral-800 dark:bg-white dark:hover:bg-neutral-200 text-white dark:text-neutral-950 rounded-full font-medium text-[13px] transition-all duration-200 active:scale-95 shrink-0 select-none outline-none focus-visible:ring-2 focus-visible:ring-neutral-400 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-[#141414] cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span class="hidden xs:block">Download</span>
      </a>
    </article>

    <!-- YouTube Music App Card -->
    <article class="bg-white dark:bg-[#141414] rounded-2xl p-4 mb-3.5 border border-neutral-200/80 dark:border-neutral-800/80 shadow-sm flex items-center gap-4 transition-all duration-300 hover:border-neutral-300 dark:hover:border-neutral-700 hover:shadow-md">
      
      <img src="https://lh3.googleusercontent.com/d/1IUz-NOgOY88Uxvj8Mh5ZflCQC8kIrubz" alt="YouTube Music Icon" 
           class="w-[46px] h-[46px] rounded-[12px] object-cover border border-black/5 dark:border-white/10 shrink-0">
      
      <div class="flex-1 min-w-0 flex flex-col justify-center">
        <h2 class="font-display text-[16px] font-medium tracking-tight text-neutral-950 dark:text-white mb-0.5 truncate">
          YouTube Music
        </h2>
        <div class="flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full shrink-0"></span>
          <span id="musicDate" class="text-[13px] text-neutral-500 dark:text-neutral-400 truncate">
            Checking for updates...
          </span>
        </div>
      </div>

      <!-- Note the added 'download' attribute -->
      <a id="musicBtn" target="_blank" download
         class="inline-flex items-center justify-center gap-1.5 h-10 px-4 xs:px-5 bg-neutral-950 hover:bg-neutral-800 dark:bg-white dark:hover:bg-neutral-200 text-white dark:text-neutral-950 rounded-full font-medium text-[13px] transition-all duration-200 active:scale-95 shrink-0 select-none outline-none focus-visible:ring-2 focus-visible:ring-neutral-400 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-[#141414] cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span class="hidden xs:block">Download</span>
      </a>
    </article>

  </main>

  <!-- Fetch Logic (Replaces Google Script Run) -->
  <script>
  const API_URL = "https://script.google.com/macros/s/AKfycbyDiUfkDL7SIjCNIKCOq-qpl0cRSUTV9Q07r6R8gZSiTpAW0AZGF2XGQdBiYMfGmRsP/exec";

  fetch(API_URL)
    .then(response => response.json())
    .then(data => {

      // Populate MicroG Card
      document.getElementById("microgDate").innerText = "Updated: " + data.microg.updated;
      document.getElementById("microgBtn").href = data.microg.url;

      // Populate YouTube Card
      document.getElementById("ytDate").innerText = "Updated: " + data.youtube.updated;
      document.getElementById("ytBtn").href = data.youtube.url;

      // Populate Music Card
      document.getElementById("musicDate").innerText = "Updated: " + data.music.updated;
      document.getElementById("musicBtn").href = data.music.url;
    })
    .catch(error => {
      console.error("Error loading updates:", error);

      document.getElementById("microgDate").innerText = "Ready to download";
      document.getElementById("ytDate").innerText = "Ready to download";
      document.getElementById("musicDate").innerText = "Ready to download";
    });
</script>

</body>
</html>
